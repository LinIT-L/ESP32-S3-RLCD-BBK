<title>LinTOS UI 设计台</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #2C2C2A; background: #F1EFE8; }
  h3 { margin: 0 0 4px; font-weight: 500; font-size: 15px; }
  .sub { font-size: 12px; color: #888780; margin-bottom: 14px; max-width: 600px; line-height: 1.5; }
  .layout { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
  .stage { display: flex; flex-direction: column; gap: 8px; }
  canvas { background: #FFFFFF; border: 1px solid #888780; border-radius: 6px;
    image-rendering: pixelated; touch-action: none; }
  .panel { width: 280px; display: flex; flex-direction: column; gap: 14px;
    background: #FFFFFF; border: 1px solid #D3D1C7; border-radius: 10px; padding: 16px; }
  .grp { display: flex; flex-direction: column; gap: 6px; }
  .grp > label { font-size: 12px; font-weight: 500; color: #5F5E5A; }
  .row { display: flex; gap: 8px; align-items: center; }
  button { flex: 1; padding: 8px 6px; font-size: 13px; cursor: pointer;
    border: 1px solid #D3D1C7; background: #FFFFFF; color: #2C2C2A;
    border-radius: 8px; transition: all .12s; font-family: inherit; }
  button:hover { background: #F1EFE8; }
  button.on { background: #2C2C2A; color: #FFFFFF; border-color: #2C2C2A; }
  input[type=range] { width: 100%; accent-color: #2C2C2A; }
  .val { font-size: 13px; font-variant-numeric: tabular-nums; min-width: 22px; text-align: right; }
  textarea { width: 100%; height: 150px; font-size: 12px;
    font-family: ui-monospace, Menlo, monospace; border: 1px solid #D3D1C7;
    border-radius: 8px; padding: 8px; resize: vertical; color: #2C2C2A; }
  .hint { font-size: 11px; color: #888780; line-height: 1.5; }
  .danger { color: #A32D2D; border-color: #F7C1C1; }
  .danger:hover { background: #FCEBEB; }
</style>

<body data-page-node-id="HxlihDFzimvJ22ezQTiq8d">
  <h3 data-page-node-id="l821deFqyTtnD4SMjvLDut">LinTOS UI 设计台 · 400×300（自由拖放）</h3>
  <div class="sub" data-page-node-id="7GZmBITmy0Bh3rptePpBFz">空白画布。四个分类图标已放好，可随意拖动重排。选「画选中框 / 画直线」后在画布上拖拽新建；切「移动」可拖动任意元素。R、方向、线宽作用于新建的框或当前选中的框。</div>
  <div class="layout" data-page-node-id="hyxwGUOTFXJthsWCXYeDb2">
    <div class="stage" data-page-node-id="9mVi5D2jTtSAFXAe7I2BI7">
      <canvas id="cv" width="400" height="300" data-page-node-id="KdnU6iScjtNP4suL8RfvXJ"></canvas>
      <div class="hint" data-page-node-id="8GJCruIXelrA1xhasjU8zT">点选元素后按「删除选中」。坐标实时导出在右侧，复制发我即可。</div>
    </div>
    <div class="panel" data-page-node-id="bNV0y0fYVQHEXKHCkPg5eL">
      <div class="grp" data-page-node-id="AllDSSiCcCUSmclo9GCGh5">
        <label data-page-node-id="PhNfOLFf0JJgu6jJeeOD3J">模式</label>
        <div class="row" data-page-node-id="BFD3KaDZQitwlGEnjCICBx">
          <button id="mMove" class="on" data-page-node-id="l2hYM3PvEWnR7mUXg3GzlR">移动</button>
          <button id="mBox" data-page-node-id="j0JvByUCabF6gYrfS6TrZi">画选中框</button>
          <button id="mLine" data-page-node-id="vbSUznqKalBVyfoObZwXAZ">画直线</button>
        </div>
      </div>
      <div class="row" data-page-node-id="vN3TECIOzLtRptuyT4rWcS"><button id="addIcon" data-page-node-id="3cIPYOYryuIq0HrPL4ANTJ">+ 分类图标</button></div>
      <div class="grp" data-page-node-id="Pp9ivQKyOSXH7nQOGZADVv">
        <label data-page-node-id="MBXGo4nX8u8hXPJi16vUxd">R 圆角半径 <span class="val" id="rv" data-page-node-id="EuhjFHblvblT5hf3hhniaI">3</span> px</label>
        <input id="r" type="range" min="0" max="12" value="3" data-page-node-id="4tLAj9Y1tOud4Apr0nIqRV">
      </div>
      <div class="grp" data-page-node-id="yAKd8MtgiP6MnPDCVHdbGo">
        <label data-page-node-id="XCrp8rAJAVTOiEF6JDrjIO">圆角方向</label>
        <div class="row" data-page-node-id="t5w7aSCO0SfL6pnrewE56m">
          <button id="dIn" class="on" data-page-node-id="p8c2IqryM8mvF0AQBa90wF">凹（弧在框内）</button>
          <button id="dOut" data-page-node-id="7fL8onUTeFgLUBiTSvxZEd">凸（弧鼓框外）</button>
        </div>
      </div>
      <div class="grp" data-page-node-id="YoPBkEvKUzUD0GOja5DVkP">
        <label data-page-node-id="D9lA2CKPpuavFbSwxgvgiD">线宽 <span class="val" id="lwv" data-page-node-id="nGLht4cTQ7awUPF5AXlN3k">2</span> px</label>
        <input id="lw" type="range" min="1" max="3" value="2" data-page-node-id="FrBKr5rKZdvm02mFXIqOzn">
      </div>
      <div class="row" data-page-node-id="EwekPbbgkoLEdM6tYslsvs">
        <button id="del" class="danger" data-page-node-id="SEyBWEzgW2pING1XmD9ZZd">删除选中</button>
        <button id="clr" class="danger" data-page-node-id="7cAKPHxudaIWuw9HRXbuSk">清空绘制</button>
      </div>
      <div class="grp" data-page-node-id="v6qJXYUOHlt4dYuCYFwhSb">
        <label data-page-node-id="k7VqySFeRXmFXSHh987Ujs">坐标导出（复制发 AI）</label>
        <textarea id="out" readonly></textarea>
      </div>
    </div>
  </div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 400, H = 300;

let mode = 'move';
let r = 3, dir = 'in', lw = 2;
let elems = [];
let sel = null;
let drag = null;

/* 预置四个可移动分类图标（无其它固定参考框） */
for (let i = 0; i < 4; i++)
  elems.push({ type: 'icon', x: 8, y: 28 + i * 67, w: 64, h: 64, label: '图标' + (i + 1) });

function roundRect(e) {
  ctx.lineWidth = e.lw; ctx.strokeStyle = (e === sel) ? '#185FA5' : '#2C2C2A';
  const x = e.x, y = e.y, x2 = x + e.w, y2 = y + e.h, R = e.r;
  if (R <= 0) { ctx.strokeRect(x, y, e.w, e.h); return; }
  if (e.dir === 'in') {
    ctx.beginPath();
    ctx.moveTo(x + R, y);
    ctx.lineTo(x2 - R, y); ctx.quadraticCurveTo(x2, y, x2, y + R);
    ctx.lineTo(x2, y2 - R); ctx.quadraticCurveTo(x2, y2, x2 - R, y2);
    ctx.lineTo(x + R, y2); ctx.quadraticCurveTo(x, y2, x, y2 - R);
    ctx.lineTo(x, y + R); ctx.quadraticCurveTo(x, y, x + R, y);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(x + R, y);
    ctx.lineTo(x2 - R, y); ctx.quadraticCurveTo(x2 + R, y, x2 + R, y + R);
    ctx.lineTo(x2 + R, y2 - R); ctx.quadraticCurveTo(x2 + R, y2, x2, y2 + R);
    ctx.lineTo(x + R, y2); ctx.quadraticCurveTo(x, y2, x - R, y2 - R);
    ctx.lineTo(x - R, y + R); ctx.quadraticCurveTo(x - R, y, x + R, y);
    ctx.stroke();
  }
}
function drawLine(e) {
  ctx.lineWidth = e.lw; ctx.strokeStyle = (e === sel) ? '#185FA5' : '#2C2C2A';
  ctx.beginPath(); ctx.moveTo(e.x1, e.y1); ctx.lineTo(e.x2, e.y2); ctx.stroke();
}
function render(e) {
  if (e.type === 'icon') {
    ctx.strokeStyle = (e === sel) ? '#185FA5' : '#B4B2A9'; ctx.lineWidth = 1.5;
    ctx.strokeRect(e.x + 0.5, e.y + 0.5, e.w - 1, e.h - 1);
    ctx.fillStyle = '#B4B2A9'; ctx.font = '12px sans-serif';
    ctx.fillText(e.label, e.x + 6, e.y + 24);
  } else if (e.type === 'box') roundRect(e);
  else drawLine(e);
}
function draw() {
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
  elems.forEach(render);
  if (drag && drag.preview) render(drag.preview);
  updateOut();
}
function segDist(e, px, py) {
  const dx = e.x2 - e.x1, dy = e.y2 - e.y1;
  const L2 = dx * dx + dy * dy || 1;
  let t = ((px - e.x1) * dx + (py - e.y1) * dy) / L2;
  t = Math.max(0, Math.min(1, t));
  const cx = e.x1 + t * dx, cy = e.y1 + t * dy;
  return Math.hypot(px - cx, py - cy);
}
function hit(px, py) {
  for (let i = elems.length - 1; i >= 0; i--) {
    const e = elems[i];
    if (e.type === 'line') { if (segDist(e, px, py) < 5) return e; }
    else if (px >= e.x && px <= e.x + e.w && py >= e.y && py <= e.y + e.h) return e;
  }
  return null;
}
function pos(e) {
  const rc = cv.getBoundingClientRect();
  return {
    x: Math.round((e.clientX - rc.left) * (W / rc.width)),
    y: Math.round((e.clientY - rc.top) * (H / rc.height))
  };
}
function updateOut() {
  document.getElementById('out').value = elems.length
    ? elems.map(e => {
        if (e.type === 'icon') return `icon x=${e.x} y=${e.y} w=${e.w} h=${e.h}`;
        if (e.type === 'box') return `box x=${e.x} y=${e.y} w=${e.w} h=${e.h} r=${e.r} dir=${e.dir} lw=${e.lw}`;
        return `line x1=${e.x1} y1=${e.y1} x2=${e.x2} y2=${e.y2} lw=${e.lw}`;
      }).join('\n')
    : '(空白)';
}

cv.addEventListener('pointerdown', e => {
  const p = pos(e);
  if (mode === 'move') {
    sel = hit(p.x, p.y);
    if (sel) drag = { el: sel, dx: p.x - sel.x, dy: p.y - sel.y };
  } else if (mode === 'box') {
    const b = { type: 'box', x: p.x, y: p.y, w: 0, h: 0, r, dir, lw };
    sel = b; drag = { preview: b };
  } else if (mode === 'line') {
    const l = { type: 'line', x1: p.x, y1: p.y, x2: p.x, y2: p.y, lw };
    sel = l; drag = { preview: l };
  }
  cv.setPointerCapture(e.pointerId); draw();
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = pos(e);
  if (drag.el) { drag.el.x = p.x - drag.dx; drag.el.y = p.y - drag.dy; }
  else if (drag.preview) {
    if (drag.preview.type === 'box') { drag.preview.w = p.x - drag.preview.x; drag.preview.h = p.y - drag.preview.y; }
    else { drag.preview.x2 = p.x; drag.preview.y2 = p.y; }
  }
  draw();
});
cv.addEventListener('pointerup', () => {
  if (!drag) return;
  if (drag.preview) {
    const b = drag.preview;
    if (b.type === 'box') {
      if (b.w < 0) { b.x += b.w; b.w = -b.w; }
      if (b.h < 0) { b.y += b.h; b.h = -b.h; }
      if (b.w > 2 && b.h > 2) elems.push(b); else sel = null;
    } else {
      if (Math.hypot(b.x2 - b.x1, b.y2 - b.y1) > 3) elems.push(b); else sel = null;
    }
  }
  drag = null; draw();
});

function setMode(m) {
  mode = m;
  ['mMove', 'mBox', 'mLine'].forEach(id =>
    document.getElementById(id).classList.toggle('on', id === ({ move: 'mMove', box: 'mBox', line: 'mLine' }[m])));
  cv.style.cursor = (m === 'move') ? 'move' : 'crosshair';
}
document.getElementById('mMove').onclick = () => setMode('move');
document.getElementById('mBox').onclick = () => setMode('box');
document.getElementById('mLine').onclick = () => setMode('line');
document.getElementById('addIcon').onclick = () => { elems.push({ type: 'icon', x: 20, y: 20, w: 64, h: 64, label: '图标' + (elems.filter(e => e.type === 'icon').length + 1) }); draw(); };
document.getElementById('del').onclick = () => { if (sel) { elems = elems.filter(e => e !== sel); sel = null; draw(); } };
document.getElementById('clr').onclick = () => { elems = elems.filter(e => e.type === 'icon'); sel = null; draw(); };
document.getElementById('r').oninput = e => { r = +e.target.value; document.getElementById('rv').textContent = r; if (sel && sel.type === 'box') { sel.r = r; draw(); } };
document.getElementById('lw').oninput = e => { lw = +e.target.value; document.getElementById('lwv').textContent = lw; if (sel && sel.type === 'box') { sel.lw = lw; draw(); } };
document.getElementById('dIn').onclick = () => { dir = 'in'; document.getElementById('dIn').classList.add('on'); document.getElementById('dOut').classList.remove('on'); if (sel && sel.type === 'box') { sel.dir = 'in'; draw(); } };
document.getElementById('dOut').onclick = () => { dir = 'out'; document.getElementById('dOut').classList.add('on'); document.getElementById('dIn').classList.remove('on'); if (sel && sel.type === 'box') { sel.dir = 'out'; draw(); } };

setMode('move');
draw();
</script>
</body>
</html>
