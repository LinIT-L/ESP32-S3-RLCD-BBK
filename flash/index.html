<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBK 固件刷写</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f4f6f8; color: #222; padding: 10px; }
  .wrap { width: 100%; max-width: 360px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; padding: 12px; }
  .title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .ver { font-size: 11px; color: #999; font-weight: 400; margin-left: 6px; }
  label { display: flex; align-items: center; gap: 6px; padding: 4px 0; cursor: pointer; font-size: 13px; }
  input[type="radio"] { margin: 0; }
  #fwInfo { margin: 6px 0 10px; font-size: 12px; color: #2b6cb0; word-break: break-all; }
  button { width: 100%; padding: 10px; font-size: 15px; font-weight: 600;
           color: #fff; background: #2b6cb0; border: 0; border-radius: 8px; cursor: pointer; }
  button:disabled { background: #9bb7d4; cursor: not-allowed; }
  button.busy { background: #d69e2e; }
  #status { margin-top: 8px; font-size: 13px; min-height: 18px; }
  #log { margin-top: 8px; font-family: Menlo, Consolas, monospace; font-size: 11px;
         color: #9ecbff; background: #0d1117; border-radius: 6px;
         padding: 8px; max-height: 100px; overflow-y: auto; white-space: pre-wrap; display: none; }
  .warn { color: #c0392b; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="title">BBK 固件刷写 <span class="ver">v2.2</span></div>
    <label><input type="radio" name="src" value="github" checked> GitHub 固件（推荐）</label>
    <label><input type="radio" name="src" value="web"> 网站固件</label>
    <label><input type="radio" name="src" value="local"> 本地文件</label>
    <input type="file" id="fileInput" accept=".bin" hidden>
    <p id="fwInfo">GitHub Release v1.1 · 16MB 完整镜像</p>
  </div>

  <button id="flashBtn">连接并烧录</button>
  <p id="status"></p>
  <div id="log"></div>
  <p class="warn" id="warn" style="display:none"></p>
</div>

<script type="module">
import { ESPLoader, Transport } from './esptool-js.bundle.js';

const FW_GITHUB = 'https://github.com/LinIT-L/ESP32-S3-RLCD-BBK/releases/download/v1.1/ESP32-S3-RLCD-BBK-16MB.bin';
const FW_WEB = 'https://bbk.linit.cn/flash/ESP32-S3-RLCD-BBK-16MB.bin';
const FLASH_ADDR = 0x0;
const $ = (id) => document.getElementById(id);

function log(msg) {
  const el = $('log');
  el.style.display = 'block';
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

$('flashBtn').addEventListener('click', async () => {
  const btn = $('flashBtn');
  const status = $('status');
  let port = null;
  let transport = null;
  try {
    /* 1. 固件来源 */
    let data;
    const src = document.querySelector('input[name="src"]:checked').value;
    if (src === 'github' || src === 'web') {
      const urls = src === 'github' ? [FW_GITHUB, FW_WEB] : [FW_WEB];
      status.textContent = '正在下载固件…';
      let r = null;
      let used = '';
      for (const u of urls) {
        try { r = await fetch(u); if (r.ok) { used = u; break; } } catch (e) {}
      }
      if (!r || !r.ok) throw new Error('固件下载失败, 请检查网络或改用本地文件');
      if (src === 'github' && used === FW_WEB) log('GitHub 固件下载失败，已自动改用网站固件');
      data = await r.arrayBuffer();
    } else {
      const f = $('fileInput').files[0];
      if (!f) throw new Error('请先选择本地 .bin 文件');
      data = await f.arrayBuffer();
    }
    log('固件已加载: ' + (data.byteLength / 1048576).toFixed(1) + ' MB');

    /* 2. 连接设备 */
    btn.disabled = true;
    btn.classList.add('busy');
    btn.textContent = '烧录中…';
    status.textContent = '请在弹出的窗口中选择设备端口…';
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 460800 });
    log('串口已连接，正在初始化…');

    transport = new Transport(port, true);
    // USB-Serial/JTAG (PID 0x1001) 不需要也无法换波特率, 保持 115200 跳过 changeBaud 重连
    const isUsbJtag = port.getInfo().usbProductId === 0x1001;
    const loader = new ESPLoader({ transport, baudrate: isUsbJtag ? 115200 : 460800 });
    await loader.main();
    const chip = loader.chip ? loader.chip.chip_name : '未知';
    log('芯片识别: ' + chip);

    /* 3. 烧录 */
    status.textContent = '正在烧录 0x0 …（约 3-5 分钟，请勿断开）';
    await loader.writeFlash({
      fileArray: [{ data, address: FLASH_ADDR }],
      eraseAll: true,
      flashSize: 'keep',
      compress: true,
      reportProgress: (fileIndex, written, total) => {
        const pct = total > 0 ? Math.round((written / total) * 100) : 0;
        status.textContent = '正在烧录… ' + pct + '%（请勿断开）';
      },
    });

    /* 4. 复位 */
    try { await loader.hardReset(); } catch (e) {}
    status.textContent = '✅ 烧录完成，设备已重启';
    log('烧录完成，设备已重启');
  } catch (err) {
    console.error(err);
    const msg = err.message || String(err);
    let tip = '';
    if (msg.includes('already open')) {
      tip = '（端口已被占用：请关闭其它打开了本刷写页面的标签页/窗口，再重新点“连接并烧录”）';
    } else if (msg.includes('NotFoundError') || msg.includes('找不到')) {
      tip = '（未找到设备：请确认设备已连接并处于下载模式）';
    }
    status.textContent = '❌ ' + msg + tip;
    log('错误: ' + msg + tip);
  } finally {
    try { if (transport) await transport.disconnect(); } catch (e) {}
    try { if (port) await port.close(); } catch (e) {}
    btn.disabled = false;
    btn.classList.remove('busy');
    btn.textContent = '连接并烧录';
  }
});

/* 本地文件选择 */
document.querySelectorAll('input[name="src"]').forEach(r => {
  r.addEventListener('change', () => {
    if (r.value === 'local') {
      $('fileInput').click();
      $('fileInput').addEventListener('change', () => {
        const f = $('fileInput').files[0];
        $('fwInfo').textContent = '本地文件 · ' + f.name + ' (' + (f.size / 1048576).toFixed(1) + ' MB)';
      });
    } else {
      $('fwInfo').textContent = r.value === 'github' ? 'GitHub Release v1.1 · 16MB 完整镜像' : '本网站固件 · 16MB 完整镜像';
    }
  });
});
</script>
</body>
</html>
