[Devices Parallel Port Setup ECP Mode DMA Channel Prompt]
Help Message=DMA (Direct Memory Access), a technique for transferring data from main memory to the parallel port devices without passing it through the CPU. Computers that have DMA channels can transfer data to and from devices while the CPU works on other tasks. 
Select DMA3 or DMA1 channel.
