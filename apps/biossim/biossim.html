Object.assign(ITEMS, HIDDEN_ITEMS);

const ACTIONS = {
  '*saveExit':   { name:'Save Changes and Exit', act:'saveexit', help:'保存并重启（真机 F10）。' },
  '*discardExit':{ name:'Discard Changes and Exit', act:'discardexit', help:'不保存退出（真机 Esc）。' },
  '*bootOrder':  { name:'Boot Priority Order', act:'bootorder', help:'开机顺序。用 +/- 把要引导的设备移到最上面。' },
};

/* ---------- 状态 ---------- */
function freshCfg(){
  const c = {};
  for (const k in ITEMS) c[k] = ITEMS[k].def;
  return { cfg:c, order: BOOT_DEVICES.slice(), saved:false };
}
let S = freshCfg();
let brand = 'ami', page = 'Main', cur = 0, helpOpen = false, dirty = false, msg = '';
let nav = [];              /* 子菜单栈: ['SATA Configuration'] 表示正停在该子菜单里 */
let boEdit = false, boSel = 0;   /* 引导顺序页: 是否进入编辑态 + 光标在第几项 */
let mode = 'boot';         /* 'boot'=打开程序时的选择屏; 'bios'=全屏 BIOS 界面 */
let bootStep = 0, bootCur = 0;   /* 选择屏: 0=选厂商, 1=选场景 */
let dlgKind = null;        /* 弹窗: null / 'help' / 'check' */
let task = 'win11';

const cfgGet  = k => (ITEMS[k].ro ? 0 : S.cfg[k]);
const cfgName = k => ITEMS[k].vals[Math.min(S.cfg[k], ITEMS[k].vals.length-1)];

function setCfg(k, v){
  const it = ITEMS[k];
  if (!it || it.ro || it.act) return false;
  S.cfg[k] = (v + it.vals.length) % it.vals.length;
  dirty = true;
  return true;
}

/* 当前页的条目列表（把 PAGES 里的 @子菜单/*动作/普通 key 统一成行对象） */
function rowsFrom(def){
  const out = [];
  for (const e of def || []){
    if (e[0] === '@'){ out.push({kind:'sub', label:e.slice(1), key:null, sub:e.slice(1)}); }
    else if (e[0] === '*'){ const a = ACTIONS[e]; out.push({kind:'act', label:a.name, key:e, help:a.help, act:a.act}); }
    else if (ITEMS[e]){ out.push({kind:'item', label:ITEMS[e].name, key:e, help:ITEMS[e].help, ro:!!ITEMS[e].ro}); }
  }
  return out;
}
/* 当前该显示哪些行：子菜单里就显示子菜单的行 */
function rows(){
  if (nav.length) return rowsFrom(SUBPAGES[nav[nav.length-1]]);
  return rowsFrom(PAGES[brand][page]);
}
/* 右侧标题（子菜单里显示面包屑，跟真机一样） */
function pageTitle(){
  if (nav.length) return page + '  >  ' + nav.join(' > ');
  return page;
}
function inSub(){ return nav.length > 0; }
function popSub(){ if (nav.length){ nav.pop(); cur = 0; return true; } return false; }

/* ============================================================================
 * 按键处理（真实 BIOS 手感）
 * ==========================================================================*/
function keyToAction(e){
  const k = e.key;
  if (k === 'ArrowUp') return 'up';
  if (k === 'ArrowDown') return 'down';
  if (k === 'ArrowLeft') return 'left';
  if (k === 'ArrowRight') return 'right';
  if (k === 'Enter') return 'enter';
  if (k === 'Escape') return 'esc';
  if (k === 'Tab') return 'tab';
  if (k === 'F1') return 'f1';
  if (k === 'F8') return 'f8';
  if (k === 'F9') return 'f9';
  if (k === 'F10') return 'f10';
  if (k === '+' || k === '=' || k === 'PageUp') return 'inc';
  if (k === '-' || k === '_' || k === 'PageDown') return 'dec';
  if (k === ' ') return 'inc';
  return null;
}

function doAction(a){
  /* ---- 打开程序时的选择屏: 两步选择 ---- */
  if (mode === 'boot'){
    if (a === 'up')   { bootCur = Math.max(0, bootCur - 1); }
    else if (a === 'down'){ bootCur = Math.min((bootStep === 0 ? Object.keys(BRANDS).length : Object.keys(TASKS).length) - 1, bootCur + 1); }
    else if (a === 'esc'){
      if (bootStep === 1){ bootStep = 0; bootCur = Object.keys(BRANDS).indexOf(brand); }
    }
    else if (a === 'enter' || a === 'right'){
      if (bootStep === 0){
        brand = Object.keys(BRANDS)[bootCur];
        page = BRANDS[brand].menus[0]; nav = []; cur = 0;
        bootStep = 1; bootCur = 0;
      } else {
        task = Object.keys(TASKS)[bootCur];
        mode = 'bios'; msg = '按 Enter 改值; F1 看说明; F8 检查; F10 保存并退出';
      }
    }
    render(); return;
  }
  /* ---- BIOS 界面 ---- */
  if (dlgKind && a === 'esc'){ dlgKind = null; render(); return; }   /* 先关弹窗 */
  if (helpOpen && a !== 'f1' && a !== 'esc') helpOpen = false;
  const rowsArr = rows();
  const R = rowsArr[cur];
  const menus = BRANDS[brand].menus;
  const mi = menus.indexOf(page);

  /* ---- 引导顺序编辑态：↑↓ 选设备，+/- 上下移，Enter/Esc 退出 ---- */
  if (boEdit && (!R || R.act !== 'bootorder')) boEdit = false;   /* 光标不在引导顺序行 → 退出编辑态, 防误操作 */
  if (boEdit){
    switch (a){
      case 'up':   if (boSel > 0) boSel--; break;
      case 'down': if (boSel < S.order.length - 1) boSel++; break;
      case 'inc': case 'dec': {           /* 上移 / 下移一位（真机是 Shift+= / -） */
        const to = (a === 'inc') ? boSel - 1 : boSel + 1;
        if (to >= 0 && to < S.order.length){
          const t = S.order[boSel]; S.order[boSel] = S.order[to]; S.order[to] = t;
          boSel = to; dirty = true;
          msg = `引导顺序已改：第 ${to+1} 位 = ${S.order[to]}`;
        }
        break;
      }
      case 'enter': case 'esc': boEdit = false; msg = '已退出引导顺序编辑'; break;
    }
    render(); return;
  }

  switch (a){
    case 'up':   if (cur > 0) cur--; break;
    case 'down': if (cur < rowsArr.length - 1) cur++; break;
    case 'left':
      if (inSub()) popSub();                       /* 子菜单里 ← = 退回上级（真机同） */
      else { page = menus[(mi - 1 + menus.length) % menus.length]; cur = 0; }
      break;
    case 'right':
      if (inSub()) popSub();
      else { page = menus[(mi + 1) % menus.length]; cur = 0; }
      break;
    case 'tab':  if (inSub()) popSub(); page = menus[(mi + 1) % menus.length]; cur = 0; break;
    case 'inc':  if (R && R.kind === 'item' && !R.ro) setCfg(R.key, S.cfg[R.key] + 1); break;
    case 'dec':  if (R && R.kind === 'item' && !R.ro) setCfg(R.key, S.cfg[R.key] - 1); break;
    case 'enter':
      if (!R) break;
      if (R.kind === 'sub'){
        if (SUBPAGES[R.sub]){ nav.push(R.sub); cur = 0; msg = '进入子菜单：' + R.sub; }
        else msg = '（本模拟器未收录该子菜单）';
      }
      else if (R.act === 'bootorder'){ boEdit = true; boSel = 0; msg = '↑↓ 选设备，+/- 上下移，Enter 退出'; }
      else if (R.act === 'saveexit'){ S.saved = true; dirty = false; msg = 'Changes saved. 正在重启…（模拟）'; }
      else if (R.act === 'discardexit'){ S = freshCfg(); dirty = false; nav = []; msg = '未保存退出，已恢复上次状态（模拟）'; }
      else if (R.key === 'loadDefaults'){ S = freshCfg(); dirty = true; msg = '已载入出厂默认（Optimal Defaults）'; }
      else if (R.kind === 'item'){ if (!R.ro) setCfg(R.key, S.cfg[R.key] + 1); }
      break;
    case 'esc':
      if (popSub()) msg = '退回上一级菜单';
      else { mode = 'boot'; bootStep = 0; bootCur = Object.keys(BRANDS).indexOf(brand); msg = ''; }  /* 最外层 Esc = 回开机选择 */
      break;
    case 'f1':   dlgKind = (dlgKind === 'help') ? null : 'help'; break;
    case 'f8':   dlgKind = (dlgKind === 'check') ? null : 'check'; break;
    case 'f9':   S = freshCfg(); dirty = true; nav = []; msg = '已载入默认值'; break;
    case 'f10':  S.saved = true; dirty = false; nav = [];
                 mode = 'boot'; bootStep = 0; bootCur = Object.keys(BRANDS).indexOf(brand);   /* 保存退出 = 重启回开机选择 */
                 break;
  }
  render();
}

/* ============================================================================
 * 判定引擎（纯函数：给定 cfg 与任务，返回逐条结果 + 总结论）
 * ========================================================================== */
function evaluate(cf, taskId){
  const t = TASKS[taskId];
  const lines = [];
  let ok = 0;
  for (const [k, want, why] of t.rules){
    const it = ITEMS[k];
    if (!it) { lines.push({ok:true, text:why, now:'（本机无此项，跳过）'}); ok++; continue; }
    const good = cf[k] === want;
    if (good) ok++;
    lines.push({ ok:good, text:why, now: it.name + ' = ' + it.vals[cf[k]] });
  }
  /* 交叉规则：连选项都不满足时给出更直接的"会卡在哪" */
  let extra = '';
  const sata = cf.sataMode, vmd = cf.vmd;
  if ((taskId==='win11' || taskId.startsWith('ubuntu')) && (sata===2 || sata===3 || vmd===1))
    extra = '⚠ 现在这个 SATA 模式，安装器会"看不到硬盘"。这是装机最常卡的一步。';
  if (taskId==='win11' && cf.secureBoot===0)
    extra += (extra?'\n':'') + '⚠ Secure Boot 关着，Win11 安装器会直接拒绝：需要 UEFI + Secure Boot + TPM 2.0。';
  if (taskId.startsWith('win7') && cf.secureBoot===1)
    extra += (extra?'\n':'') + '⚠ Secure Boot 开着装 Win7：会出现"Windows 无法验证数字签名"。';
  const pass = ok === t.rules.length;
  return { lines, ok, total:t.rules.length, pass, extra };
}

/* ============================================================================
 * 渲染
 * ==========================================================================*/
/* ============================================================================
 * 渲染层：掌机风格 —— 纯黑白、全屏字符网格（模拟 ST7305 1bpp 屏）
 * ==========================================================================*/
const scr = document.getElementById('scr');
const dlg = document.getElementById('dlg');
let COLS = 84, ROWS = 30;      /* 由窗口尺寸实时算出, 见 measureGrid() */

/* 中文占 2 格 —— 必须按**显示宽度**排版, 否则汉字后面的对齐全是错的 */
function dw(s){
  let w = 0;
  for (const ch of String(s)){
    const c = ch.codePointAt(0);
    const wide = (c >= 0x1100 && (c <= 0x115f || c === 0x2329 || c === 0x232a ||
                 (c >= 0x2e80 && c <= 0xa4cf) || (c >= 0xac00 && c <= 0xd7a3) ||
                 (c >= 0xf900 && c <= 0xfaff) || (c >= 0xfe30 && c <= 0xfe6f) ||
                 (c >= 0xff00 && c <= 0xff60) || (c >= 0xffe0 && c <= 0xffe6) ||
                 (c >= 0x20000 && c <= 0x3fffd)));
    w += wide ? 2 : 1;
  }
  return w;
}
function cutW(s, n){                    /* 按显示宽度截断 */
  let r = '', w = 0;
  for (const ch of String(s)){ const c = dw(ch); if (w + c > n) break; r += ch; w += c; }
  return r;
}
function padW(s, n){ s = cutW(s, n); while (dw(s) < n) s += ' '; return s; }
function wrapW(text, w){                 /* 按显示宽度折行 */
  const out = [];
  for (const para of String(text).split('\n')){
    let line = '';
    for (const ch of para){
      if (dw(line) + dw(ch) > w){ out.push(line); line = ''; }
      line += ch;
    }
    out.push(line);
  }
  return out;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function L(text, inv){ return inv ? `<span class="inv">${esc(text)}</span>` : esc(text); }
function mid(text, w){ const n = Math.max(0, Math.floor((COLS - dw(text)) / 2) - Math.floor((w - dw(text)) / 2)); return ' '.repeat(n) + text; }

function measureGrid(){
  const cs = getComputedStyle(scr);
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font:' + cs.font;
  probe.textContent = 'M'.repeat(200);
  document.body.appendChild(probe);
  const cw = probe.getBoundingClientRect().width / 200;
  document.body.removeChild(probe);
  const lh = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.15;
  COLS = Math.max(40, Math.floor((window.innerWidth  - 18) / cw));
  ROWS = Math.max(14, Math.floor((window.innerHeight - 14) / lh));
}
function setMono(){
  scr.className = (BRANDS[brand].mono === 'light') ? 'scr-light' : 'scr-dark';
  dlg.className = (BRANDS[brand].mono === 'light' ? 'scr-light' : 'scr-dark') + (dlgKind ? '' : ' hide');
}

/* ---- 开机选择屏：打开程序时先选（厂商 → 场景） ---- */
function renderBoot(){
  const out = [];
  out.push('');
  out.push(mid('BIOS 模拟器  装机学习台', 22));
  out.push(mid('400x300  1bpp', 13));
  out.push('');
  if (bootStep === 0){
    out.push(padW('  第 1 步 / 2   选择 BIOS 厂商界面', COLS));
    out.push('');
    Object.keys(BRANDS).forEach((k, i) => {
      const it = BRANDS[k];
      out.push(L(padW(`   ${i === bootCur ? '▶' : ' '} ${it.label}`, COLS), i === bootCur));
    });
  } else {
    out.push(padW(`  第 2 步 / 2   厂商: ${BRANDS[brand].label}`, COLS));
    out.push(padW('  选择要练的装机场景', COLS));
    out.push('');
    Object.keys(TASKS).forEach((k, i) => {
      out.push(L(padW(`   ${i === bootCur ? '▶' : ' '} ${TASKS[k].label}`, COLS), i === bootCur));
    });
  }
  while (out.length < ROWS - 1) out.push('');
  out.push(padW('  ↑↓ 选择     Enter 进入     Esc 返回', COLS));
  scr.className = 'scr-dark';
  scr.innerHTML = out.slice(0, ROWS).join('\n');
}

/* ---- 全屏 BIOS 界面（无边框、无按键提示条） ---- */
function renderBios(){
  setMono();
  const B = BRANDS[brand];
  const rowsArr = rows();
  if (cur >= rowsArr.length) cur = Math.max(0, rowsArr.length - 1);
  const out = [];

  out.push(L(padW(' ' + B.title, COLS), true));           /* 标题栏: 反色 */
  out.push('─'.repeat(COLS));

  if (B.layout === 'topmenu'){
    let bar = '';
    for (const m of B.menus) bar += (m === page) ? `<@INV>${esc(padW(' ' + m + ' ', dw(m) + 2))}</@INV>` : esc(padW(' ' + m + ' ', dw(m) + 2));
    out.push(bar);
    out.push('─'.repeat(COLS));
    out.push(padW('  ' + pageTitle() + (inSub() ? '   (Esc 返回上级)' : ''), COLS));
    out.push('');
    const half = Math.ceil(rowsArr.length / 2);
    const W = Math.floor(COLS / 2) - 1;
    const cell = (r, i) => {
      const on = (i === cur);
      const val = r.kind === 'item' ? cfgName(r.key) : '[Enter]';
      const ro = !!r.ro || (r.kind === 'item' && ITEMS[r.key].ro);
      const t = padW(`${on ? '▶' : ' '} ${r.label}`, Math.max(dw(r.label) + 2, 26)) + ' ' + val;
      return on ? L(padW(t, W), true) : (ro ? esc(padW(t, W)) : esc(padW(t, W)));
    };
    for (let i = 0; i < half; i++){
      out.push(cell(rowsArr[i], i) + (i + half < rowsArr.length ? cell(rowsArr[i + half], i + half) : ''));
    }
  } else {
    const LW = 26, RW = COLS - LW - 2;
    const left = B.menus.slice(0, Math.max(4, ROWS - 12)).map(m => L(padW(' ' + m, LW), m === page));
    const right = [L(padW(' ' + pageTitle() + (inSub() ? '  (Esc 返回)' : ''), RW), true)];
    rowsArr.forEach((r, i) => {
      const on = (i === cur);
      const val = r.kind === 'item' ? cfgName(r.key) : '[Enter]';
      const t = padW(`${on ? '▶' : ' '} ${r.label}`, Math.max(dw(r.label) + 2, 30)) + ' ' + val;
      right.push(on ? L(padW(t, RW), true) : esc(padW(t, RW)));
    });
    for (let i = 0; i < Math.max(left.length, right.length); i++)
      out.push((left[i] || ' '.repeat(LW)) + '  ' + (right[i] || ''));
  }

  /* 引导顺序页: 把真实设备串列出来, 编辑态带光标 */
  const curRow = rowsArr[cur];
  if (curRow && curRow.act === 'bootorder'){
    out.push('');
    out.push(L(padW(boEdit ? '  Boot Priority Order  ↑↓选  +/-上下移  Enter退出'
                           : '  Boot Priority Order', COLS), true));
    S.order.forEach((d, i) => {
      const t = padW(`  ${boEdit && i === boSel ? '▶' : ' '} ${i + 1}. ${d}`, COLS);
      out.push((boEdit && i === boSel) ? L(t, true) : esc(t));
    });
  }
  if (msg) out.push(L(padW(' ' + msg, COLS), true));

  /* 底部只有一行"任务 + 进度", 不放按键提示 */
  const r = evaluate(S.cfg, task);
  const right = `符合 ${r.ok}/${r.total}` + (r.pass ? '  可装机' : '');
  while (out.length < ROWS - 1) out.push('');
  out.push(L(padW(padW(' 任务: ' + TASKS[task].label, COLS - dw(right) - 1) + ' ' + right, COLS), true));

  scr.innerHTML = out.slice(0, ROWS).join('\n').replace(/<\/@INV>/g, '</span>').replace(/<@INV>/g, '<span class="inv">');
}

/* ---- 黑白弹窗（帮助 / 检查结果）: 双线框, 居中 ---- */
function renderDlg(){
  if (!dlgKind){ dlg.className = 'hide'; return; }
  setMono();
  const W = Math.min(COLS - 4, 62);
  const rowsArr = rows();
  const R = rowsArr[cur];
  let title = '', body = [];
  if (dlgKind === 'help'){
    title = R ? R.label : '帮助';
    body = R ? wrapW(R.help || '（此项无额外说明）', W - 4) : [];
    body.push('');
    body = body.concat(wrapW('键位: ' + BRANDS[brand].fbar, W - 4));
  } else {
    const r = evaluate(S.cfg, task);
    title = '检查结果';
    body = wrapW(TASKS[task].brief, W - 4);
    body.push('');
    for (const l of r.lines){
      const mark = l.ok ? '✔' : '✘';
      const t = body.length;
      body = body.concat(wrapW(`${mark} ${l.text}`, W - 4).map((x, k) => k ? '   ' + x : x));
      body.push('   当前: ' + l.now);
    }
    if (r.extra) { body.push(''); body = body.concat(wrapW(r.extra, W - 4)); }
    body.push('');
    body = body.concat(wrapW(r.pass ? '这台机器的设置可以装这个系统了。' : `还差 ${r.total - r.ok} 项, 标 ✘ 的就是要改的。`, W - 4));
  }
  const inner = W - 2;
  const o = [];
  o.push('┌' + '─'.repeat(inner) + '┐');
  o.push('│ ' + padW(cutW(title, inner - 2), inner - 2) + ' │');
  o.push('├' + '─'.repeat(inner) + '┤');
  for (const b of body.slice(0, Math.min(body.length, ROWS - 8))) o.push('│ ' + padW(cutW(b, inner - 2), inner - 2) + ' │');
  o.push('└' + '─'.repeat(inner) + '┘');
  dlg.innerHTML = o.join('\n');
  dlg.className = (BRANDS[brand].mono === 'light' ? 'scr-light' : 'scr-dark');
}

function render(){
  if (mode === 'boot') renderBoot(); else renderBios();
  renderDlg();
}

/* ============================================================================
 * 自测：不依赖浏览器交互，直接断言引擎
 * ==========================================================================*/
function runSelftest(){
  const L = [];
  const P = (n, ok, extra) => L.push(`${ok ? 'PASS' : 'FAIL'}  ${n}${extra ? '  — ' + extra : ''}`);
  const clone = () => JSON.parse(JSON.stringify(S.cfg));

  /* 1) 默认值下：Win11 不该通过（正是真机出厂状态的坑） */
  let c = clone();
  let r = evaluate(c, 'win11');
  P('默认设置下 Win11 判定为不通过', r.pass === false, `ok=${r.ok}/${r.total}`);

  /* 2) 按 Win11 规则全部设对 → 必须通过 */
  c = clone();
  for (const [k, v] of TASKS['win11'].rules) c[k] = v;
  r = evaluate(c, 'win11');
  P('Win11 规则全部满足时判定通过', r.pass === true, `ok=${r.ok}/${r.total}`);

  /* 3) 唯一一项错（Secure Boot 关）→ 必须不通过，且提示里点名 Secure Boot */
  c = clone();
  for (const [k, v] of TASKS['win11'].rules) c[k] = v;
  c.secureBoot = 0;
  r = evaluate(c, 'win11');
  P('Win11 只把 Secure Boot 关掉 → 不通过', r.pass === false);
  P('Win11 关 Secure Boot 会给出明确提示', /Secure Boot/.test(r.extra || ''));

  /* 4) SATA=RAID/VMD 时 Linux 必须报"看不到盘" */
  c = clone();
  for (const [k, v] of TASKS['ubuntu'].rules) c[k] = v;
  c.sataMode = 2;
  r = evaluate(c, 'ubuntu');
  P('Linux 在 RAID 模式下判定不通过', r.pass === false);
  P('Linux + RAID 会提示看不到硬盘', /看不到硬盘/.test(r.extra || ''));
  c.sataMode = 3; c.vmd = 1;
  r = evaluate(c, 'ubuntu');
  P('Linux 在 VMD 打开时判定不通过', r.pass === false);

  /* 5) Win7 传统：Secure Boot 开 → 必须报数字签名问题 */
  c = clone();
  for (const [k, v] of TASKS['win7-legacy'].rules) c[k] = v;
  c.secureBoot = 1;
  r = evaluate(c, 'win7-legacy');
  P('Win7 传统 + Secure Boot 开 → 不通过', r.pass === false);
  P('Win7 + Secure Boot 提示数字签名', /数字签名/.test(r.extra || ''));

  /* 6) 每套皮肤 × 每个页面都能渲染出行（不崩、不空） */
  let pageCount = 0, emptyPages = [];
  for (const b in PAGES){
    for (const p in PAGES[b]){
      const oldB = brand, oldP = page;
      brand = b; page = p;
      const rs = rows();
      pageCount++;
      if (rs.length === 0) emptyPages.push(b + '/' + p);
      brand = oldB; page = oldP;
    }
  }
  P(`全部皮肤页面都能列出条目（${pageCount} 页）`, emptyPages.length === 0, emptyPages.join(','));

  /* 7) 页面里引用的 key 必须都在 ITEMS / ACTIONS 里（防手写错字） */
  const badKeys = [];
  for (const b in PAGES) for (const p in PAGES[b]) for (const e of PAGES[b][p]){
    if (e[0] === '@') continue;
    if (e[0] === '*'){ if (!ACTIONS[e]) badKeys.push(b+'/'+p+':'+e); }
    else if (!ITEMS[e]) badKeys.push(b+'/'+p+':'+e);
  }
  P('PAGES 里引用的 key 全部存在', badKeys.length === 0, badKeys.join(','));

  /* 8) 任务里的规则 key 必须都在 ITEMS 里 */
  const badTaskKeys = [];
  for (const t in TASKS) for (const [k] of TASKS[t].rules) if (!ITEMS[k]) badTaskKeys.push(t+':'+k);
  P('TASKS 里的规则 key 全部存在', badTaskKeys.length === 0, badTaskKeys.join(','));

  /* 9) 只读项不可改 */
  const before = S.cfg.biosVer;
  setCfg('biosVer', 5);
  P('只读项（BIOS Version）改不动', S.cfg.biosVer === before);

  /* 10) 枚举项来回 +/- 应回到原值（回绕正确） */
  const v0 = S.cfg.sataMode;
  setCfg('sataMode', v0 + 1); setCfg('sataMode', v0);
  P('枚举项 +/- 回绕后回到原值', S.cfg.sataMode === v0);

  /* 11) F10 保存后 dirty 归零 */
  dirty = true; doAction('f10');
  P('F10 保存后不再有未保存改动', dirty === false && S.saved === true);

  /* 12) 每个任务都能算出一个明确结论（不返回 undefined） */
  let ok12 = true;
  for (const t in TASKS){ const rr = evaluate(S.cfg, t); if (typeof rr.pass !== 'boolean' || !rr.lines.length) ok12 = false; }
  P('所有任务都能给出逐条结论', ok12);

  /* 13) 子菜单：Enter 进得去、Esc 回得来、不崩 */
  const ob = brand, op = page, oc = cur;
  brand = 'ami'; page = 'Advanced'; nav = []; cur = 0;
  cur = rows().findIndex(r => r.kind === 'sub');   /* ⚠ rows() 每次返回新对象, 不能用 indexOf(旧对象) */
  const subName = rows()[cur] ? rows()[cur].sub : null;
  doAction('enter');
  P('Enter 能进入子菜单', nav.length === 1 && nav[0] === subName, nav.join(',') || '(nav 为空)');
  const inRows = rows().length;
  P('子菜单里能列出该子菜单的项', inRows > 0);
  doAction('esc');
  P('Esc 能退出子菜单', nav.length === 0);
  P('退出后回到原页面且行数恢复', page === 'Advanced' && rows().length >= 6, 'rows=' + rows().length);
  brand = ob; page = op; cur = oc; nav = [];

  /* 14) 引导顺序：进入编辑 → 下移一位 → 顺序确实变了 */
  const before0 = S.order[0], before1 = S.order[1];
  brand = 'ami'; page = 'Boot';
  cur = rows().findIndex(r => r.act === 'bootorder');
  if (cur < 0) cur = 0;
  doAction('enter');                 /* 进编辑态 */
  doAction('inc');                   /* 把 0 号上移 = 与上一位交换, 0 号已是最上 → 不移 */
  doAction('down'); doAction('inc'); /* 选 1 号并上移 → 与 0 号交换 */
  P('引导顺序可上下移动', S.order[0] === before1 && S.order[1] === before0,
    S.order.slice(0,2).join(' | '));
  doAction('enter');                 /* 退出编辑态 */
  brand = ob; page = op; cur = oc;

  const fails = L.filter(x => x.startsWith('FAIL')).length;
  const head = `自测 ${L.length} 项：通过 ${L.length - fails}，失败 ${fails}`;
  return head + '\n' + L.join('\n');
}

/* ============================================================================
 * 启动
 * ==========================================================================*/
(function init(){
  /* 允许用 URL 参数直接定位: ?brand=dell&task=win7-legacy&page=Security
   * (方便截图/自测/给别人发"直接看这一页"的链接) */
  const q = new URLSearchParams(location.search);
  if (q.get('brand') && BRANDS[q.get('brand')]) brand = q.get('brand');
  if (q.get('task')  && TASKS[q.get('task')])  task  = q.get('task');
  const sb = document.getElementById('brand');
  for (const k in BRANDS){ const o = document.createElement('option'); o.value = k; o.textContent = BRANDS[k].label; sb.appendChild(o); }
  sb.value = brand;
  page = BRANDS[brand].menus[0];
  if (q.get('page') && PAGES[brand][q.get('page')]) page = q.get('page');
  if (q.get('sub') && SUBPAGES[q.get('sub')]){ nav = [q.get('sub')]; cur = 0; }   /* 深链: 直接进某个子菜单 */
  if (q.get('boedit') === '1'){ boEdit = true; boSel = 0; }   /* 深链: 引导顺序编辑态; 光标下面定位 */                      /* 深链: 引导顺序编辑态 */
  sb.onchange = () => { brand = sb.value; page = BRANDS[brand].menus[0]; cur = 0; render(); };

  const st = document.getElementById('task');
  for (const k in TASKS){ const o = document.createElement('option'); o.value = k; o.textContent = TASKS[k].label; st.appendChild(o); }
  st.value = task;
  st.onchange = () => { task = st.value; render(); };

  document.getElementById('btn-check').onclick = () => { task = st.value; render(); };
  document.getElementById('btn-reset').onclick  = () => { S = freshCfg(); dirty = false; msg = '已恢复这台机器的默认值'; render(); };
  document.getElementById('btn-selftest').onclick = () => {
    const out = runSelftest();
    document.getElementById('selftest-out').textContent = out;
    document.getElementById('selftest-card').scrollIntoView({behavior:'smooth'});
  };

  document.addEventListener('keydown', e => {
    const a = keyToAction(e);
    if (!a) return;
    e.preventDefault();
    doAction(a);
  });
  scr.addEventListener('click', () => scr.focus());

  if (boEdit){   /* 深链进了编辑态: 把光标定位到引导顺序那一行 */
    const bi = rows().findIndex(r => r.act === 'bootorder');
    if (bi >= 0) cur = bi; else boEdit = false;
  }
  render();
  /* ?selftest=1 → 自动跑并写进 DOM（供无头浏览器抓取） */
  if (location.search.indexOf('selftest=1') >= 0){
    const out = runSelftest();
    document.getElementById('selftest-out').textContent = out;
    console.log(out);
  }
})();
</script>
